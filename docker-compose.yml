services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dashboard_receita_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    networks:
      - dashboard_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dashboard_receita_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - dashboard_network

networks:
  dashboard_network:
    driver: bridge

